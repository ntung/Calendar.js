<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Calendar.js - Overlapped Events</title>
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../../dist/calendar.js.css">
        <script src="../../src/calendar.js"></script>
    </head>

    <body>
        <div class="header">
            <h1 id="header">Calendar.js - Overlapped Events</h1>
            <p>Events that overlap (including 3+ starting at the same time) are laid out in separate columns in the full-day and full-week views.</p>
        </div>

        <div class="contents">
            <div id="calendar" style="max-width: 800px;"></div>
            <br/>
            <br/>
            <h2>Timeline View:</h2>
            <div id="calendar-timeline" style="max-width: 800px;"></div>
        </div>
    </body>

    <script>
        const calendarInstance = new calendarJs( "calendar", {
            viewToOpenOnFirstLoad: "full-day"
        } );

        const calendarTimelineInstance = new calendarJs( "calendar-timeline", {
            viewToOpenOnFirstLoad: "timeline"
        } );

        document.title += " v" + calendarInstance.getVersion();

        function createEvent( title, fromHour, toHour ) {
            const today = new Date(),
                from = new Date( today.getFullYear(), today.getMonth(), today.getDate(), fromHour, 0 ),
                to = new Date( today.getFullYear(), today.getMonth(), today.getDate(), toHour, 0 );

            return { from: from, to: to, title: title };
        }

        function createEvents() {
            return [
                createEvent( "Same Start 1", 9, 10 ),
                createEvent( "Same Start 2", 9, 10 ),
                createEvent( "Same Start 3", 9, 11 ),
                createEvent( "Same Start 4", 9, 10 ),
                createEvent( "Chain 1", 13, 15 ),
                createEvent( "Chain 2", 14, 16 ),
                createEvent( "Chain 3", 15, 17 ),
                createEvent( "Alone", 19, 20 )
            ];
        }

        calendarInstance.addEvents( createEvents() );
        calendarTimelineInstance.addEvents( createEvents() );
    </script>
</html>
